baseURL = '/'
locale = 'zh-cn'
title = 'library-A4'
theme = 'PaperMod'

[params]
  description = '千页成书，万言叙事。'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  homeInfoParams =
    '''这是我在互联网上的一片自留地，存放写下的东西。'''

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"